[package]
name = "rootara-reader"
version = "2.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
arrow-array = "56"
arrow-schema = "56"
clap = { version = "4", features = ["derive"] }
csv = "1"
parquet = { version = "56", default-features = false, features = ["arrow", "zstd", "snap"] }
rusqlite = "0.32"
serde_json = "1"
tempfile = "3"

# The Linux image shares SQLite with Python so REAL affinity, including
# decimal rounding, is identical for old and newly imported reports.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
