[package]
name = "rootara-server"
version = "2.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
futures-util = "0.3"
hmac = "0.12"
http-body-util = "0.1"
mime_guess = "2"
rand = "0.8"
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Linux image shares SQLite with rootara-reader so REAL affinity, including
# decimal rounding, is identical for old and newly imported reports.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
