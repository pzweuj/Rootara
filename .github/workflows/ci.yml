name: Rootara CI and image release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build
        env:
          ADMIN_EMAIL: ci@example.invalid
          ADMIN_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-jwt-secret
          ROOTARA_BACKEND_API_KEY: ci-only-backend-key
          ROOTARA_BACKEND_URL: http://127.0.0.1:8000

      - name: Ensure SQLite development headers
        run: dpkg -s libsqlite3-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libsqlite3-dev)

      - run: cargo fmt --manifest-path backend/reader/Cargo.toml --check
      - run: cargo build --locked --manifest-path backend/reader/Cargo.toml
      - run: cargo fmt --manifest-path backend/server/Cargo.toml --check
      - run: cargo test --locked --manifest-path backend/server/Cargo.toml
      - run: cargo run --locked --manifest-path backend/server/Cargo.toml -- validate-catalog

  image:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version and image tags
        id: release
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/rootara"
          TAG=""
          PUSH="false"
          IS_LATEST="false"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
            PUSH="true"
          elif [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            SUBJECT="$(git log -1 --pretty=%s)"
            if [[ "$SUBJECT" =~ ^[[:space:]]*(release:[[:space:]]*)?(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)[[:space:]]*$ ]]; then
              TAG="${BASH_REMATCH[2]}"
              PUSH="true"
            fi
          fi

          if [[ "$PUSH" == "true" ]]; then
            VERSION="${TAG#v}"
            if [[ "$TAG" != *-* ]]; then
              IS_LATEST="true"
            fi
          else
            TAG="ci"
            VERSION="0.0.0-ci"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            if [[ "$IS_LATEST" == "true" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.release.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64
          build-args: |
            ROOTARA_VERSION=${{ steps.release.outputs.version }}
          push: ${{ steps.release.outputs.push == 'true' }}
          tags: ${{ steps.release.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
