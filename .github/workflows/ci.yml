name: Rootara CI and image release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build
        env:
          ADMIN_EMAIL: ci@example.invalid
          ADMIN_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-jwt-secret
          ROOTARA_BACKEND_API_KEY: ci-only-backend-key
          ROOTARA_BACKEND_URL: http://127.0.0.1:8000

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend python -m compileall -q backend deploy
      - run: PYTHONPATH=backend python -m scripts.trait_rule_validation
      - run: PYTHONPATH=backend python -m scripts.candidate_review_validation
      - run: PYTHONPATH=backend python -m scripts.production_catalog_validation
      - run: PYTHONPATH=backend python -m pytest -q backend/tests

  image:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image version
        id: image-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64
          build-args: |
            ROOTARA_VERSION=${{ steps.image-version.outputs.value }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rootara:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
            ghcr.io/${{ github.repository_owner }}/rootara:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
