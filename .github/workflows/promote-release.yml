name: Promote a validated Rootara image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing validated image tag, for example v1.0.0-rc.1
        required: true
        type: string
      release_tag:
        description Stable release tag, for example v1.0.0
        required: true
        type: string

permissions:
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the exact validated digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rootara
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE_TAG" \
            --tag "$IMAGE:${RELEASE_TAG%.*}" \
            --tag "$IMAGE:${RELEASE_TAG%%.*}" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$SOURCE_TAG"
